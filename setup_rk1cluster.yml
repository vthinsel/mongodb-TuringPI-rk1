---
# Ensure RK1 cluster nodes have correct /etc/hosts entries, DNS, hostname,
# packages updated and reboot when required. Runs one node at a time.
- name: Setup RK1 cluster nodes
  #hosts: mongodb_cluster
  hosts: all
  serial: 1
  become: yes
  gather_facts: yes

  vars:
    cluster_hosts:
      - { name: rk1-node1, ip: "{{ hostvars['rk1-node1'].ansible_host | default('192.168.2.201') }}" }
      - { name: rk1-node2, ip: "{{ hostvars['rk1-node2'].ansible_host | default('192.168.2.202') }}" }
      - { name: rk1-node3, ip: "{{ hostvars['rk1-node3'].ansible_host | default('192.168.2.203') }}" }
      - { name: rk1-node4, ip: "{{ hostvars['rk1-node4'].ansible_host | default('192.168.2.204') }}" }
    resolv_dns: "{{ dns_server }}"
    domain_dns: "{{ dns_domain }}"
    kernel_package_dir: "{{ playbook_dir }}"
    kernel_image_package: linux-image-5.10.160-rockchip-thp1_5.10.160-37_arm64.deb
    kernel_headers_package: linux-headers-5.10.160-rockchip-thp1_5.10.160-37_arm64.deb

  tasks:
    - name: Ensure /etc/hosts contains cluster entries
      blockinfile:
        path: /etc/hosts
        create: yes
        block: |
          {% for h in cluster_hosts %}
          {{ h.ip }} {{ h.name }}
          {% endfor %}
      notify: reload_hosts_cache

    - name: Ensure hostname is set to inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Configure systemd-resolved to use lab DNS
      copy:
        dest: /etc/systemd/resolved.conf
        content: |
          [Resolve]
          DNS={{ resolv_dns }}
          Domains={{ domain_dns }}
          DNSStubListener=yes
        mode: '0644'
      notify: restart_systemd_resolved

    - name: Force /etc/resolv.conf to the lab DNS (best-effort)
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ resolv_dns }}
        mode: '0644'
        backup: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Copy custom kernel packages
      copy:
        src: "{{ kernel_package_dir }}/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: '0644'
      loop:
        - "{{ kernel_headers_package }}"
        - "{{ kernel_image_package }}"

    - name: Install custom kernel headers
      apt:
        deb: "/tmp/{{ kernel_headers_package }}"

    - name: Install custom kernel image
      apt:
        deb: "/tmp/{{ kernel_image_package }}"

    - name: Hold custom kernel packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - linux-headers-5.10.160-rockchip-thp1
        - linux-image-5.10.160-rockchip-thp1

    - name: Upgrade all packages (dist-upgrade)
      apt:
        upgrade: dist
        autoremove: yes
      register: apt_upgrade

    - name: Install utility packages
      apt:
        name:
          - mc
          - btop
          - iftop
          - nmap
          - tcpdump
          - python-is-python3
        state: present

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Install docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - logrotate
        state: present

    - name: Configure container logging and reclaim root filesystem space
      include_tasks: configure_container_logging_tasks.yml

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required


    - name: Reboot if required (kernel or important updates)
      reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

  handlers:
    - name: restart_docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes

    - name: restart_systemd_journald
      systemd:
        name: systemd-journald
        state: restarted
        daemon_reload: yes

    - name: restart_systemd_resolved
      systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: yes

    - name: reload_hosts_cache
      command: /bin/true
