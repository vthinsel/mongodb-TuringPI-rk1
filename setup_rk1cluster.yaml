---
# Ensure RK1 cluster nodes have correct /etc/hosts entries, DNS, hostname,
# packages updated and reboot when required. Runs one node at a time.
- name: Setup RK1 cluster nodes
  hosts: mongodb_cluster
  serial: 1
  become: yes
  gather_facts: yes

  vars:
    cluster_hosts:
      - { name: rk1-node1, ip: "{{ hostvars['rk1-node1'].ansible_host | default('192.168.2.201') }}" }
      - { name: rk1-node2, ip: "{{ hostvars['rk1-node2'].ansible_host | default('192.168.2.202') }}" }
      - { name: rk1-node3, ip: "{{ hostvars['rk1-node3'].ansible_host | default('192.168.2.203') }}" }
      - { name: rk1-node4, ip: "{{ hostvars['rk1-node4'].ansible_host | default('192.168.2.204') }}" }
    resolv_dns: "{{ dns_server }}"
    domain_dns: "{{ dns_domain }}"

  tasks:
    - name: Ensure /etc/hosts contains cluster entries
      blockinfile:
        path: /etc/hosts
        create: yes
        block: |
          {% for h in cluster_hosts %}
          {{ h.ip }} {{ h.name }}
          {% endfor %}
      notify: reload_hosts_cache

    - name: Ensure hostname is set to inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Configure systemd-resolved to use lab DNS
      copy:
        dest: /etc/systemd/resolved.conf
        content: |
          [Resolve]
          DNS={{ resolv_dns }}
          Domains={{ domain_dns }}
          DNSStubListener=yes
        mode: '0644'
      notify: restart_systemd_resolved

    - name: Force /etc/resolv.conf to the lab DNS (best-effort)
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ resolv_dns }}
        mode: '0644'
        backup: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages (dist-upgrade)
      apt:
        upgrade: dist
        autoremove: yes
      register: apt_upgrade

    - name: Install utility packages
      apt:
        name:
          - mc
          - btop
          - iftop
          - nmap
          - tcpdump
        state: present

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required (kernel or important updates)
      reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

  handlers:
    - name: restart_systemd_resolved
      systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: yes

    - name: reload_hosts_cache
      command: /bin/true
