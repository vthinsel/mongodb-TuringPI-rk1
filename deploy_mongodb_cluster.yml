---
- name: Deploy MongoDB Cluster on TuringPi RK1 Modules
  hosts: mongodb_cluster
  become: yes
  vars:
    mongodb_version: "8.3.8"
    replica_set_name: "turingpi_rs"
    mongodb_port: 27017
    mongodb_storage_device: "/dev/nvme0n1"
    mongodb_storage_mount: "/data"
    mongodb_wiredtiger_cache_size_gb: 6
    mongodb_wiredtiger_collection_compressor: "zstd"
    mongodb_glibc_tunables: "glibc.pthread.rseq=0"
    
  tasks:
    - name: 🚀 Starting MongoDB deployment on TuringPi ARM cluster
      debug:
        msg: "Deploying MongoDB to {{ inventory_hostname }}"
        
    # OS Optimization Tasks
    # MongoDB 8's upgraded TCMalloc requires THP and per-CPU caches on ARM64.
    - name: 📊 Optimize OS - Locate the kernel THP interface
      shell: |
        if [ -d /sys/kernel/mm/transparent_hugepage ]; then
          echo /sys/kernel/mm/transparent_hugepage
        elif [ -d /sys/kernel/mm/redhat_transparent_hugepage ]; then
          echo /sys/kernel/mm/redhat_transparent_hugepage
        fi
      register: thp_root
      changed_when: false

    - name: 📊 Optimize OS - Require kernel THP support
      fail:
        msg: >-
          The kernel on {{ inventory_hostname }} does not expose a THP sysfs
          interface. MongoDB 8 requires THP on supported ARM64 systems. Install
          or boot an RK1 kernel with CONFIG_TRANSPARENT_HUGEPAGE enabled, then
          rerun this playbook.
      when: thp_root.stdout | trim == ''

    - name: 📊 Optimize OS - Stop obsolete THP disable service
      systemd:
        name: disable-thp.service
        daemon_reload: yes
        enabled: no
        state: stopped
      failed_when: false

    - name: 📊 Optimize OS - Remove obsolete THP disable service
      file:
        path: /etc/systemd/system/disable-thp.service
        state: absent

    - name: 📊 Optimize OS - Enable Transparent Huge Pages for MongoDB 8
      copy:
        dest: /etc/systemd/system/enable-transparent-huge-pages.service
        mode: '0644'
        content: |
          [Unit]
          Description=Enable Transparent Huge Pages (THP) for MongoDB 8
          DefaultDependencies=no
          After=sysinit.target local-fs.target
          Before=basic.target docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/mongodb-enable-thp
          RemainAfterExit=yes

          [Install]
          WantedBy=basic.target
      notify: enable_thp_service

    - name: 📊 Optimize OS - Install MongoDB 8 THP configuration script
      copy:
        dest: /usr/local/sbin/mongodb-enable-thp
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu

          if [ -d /sys/kernel/mm/transparent_hugepage ]; then
            thp_root=/sys/kernel/mm/transparent_hugepage
          elif [ -d /sys/kernel/mm/redhat_transparent_hugepage ]; then
            thp_root=/sys/kernel/mm/redhat_transparent_hugepage
          else
            echo 'THP sysfs interface is missing; kernel support is required.' >&2
            exit 1
          fi

          printf '%s\n' always > "$thp_root/enabled"

          if ! printf '%s\n' defer+madvise > "$thp_root/defrag"; then
            printf '%s\n' madvise > "$thp_root/defrag"
          fi

          if [ -w "$thp_root/khugepaged/max_ptes_none" ]; then
            printf '%s\n' 0 > "$thp_root/khugepaged/max_ptes_none"
          fi

          printf '%s\n' 1 > /proc/sys/vm/overcommit_memory

    - name: 📊 Optimize OS - Set CPU governor to performance (RK3588 big.LITTLE cores)
      copy:
        dest: /etc/systemd/system/rk1-performance-governor.service
        mode: '0644'
        content: |
          [Unit]
          Description=Set RK1 CPU frequency governors for MongoDB
          After=sysinit.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'for gov in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > "$gov" || true; done'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      notify: enable_performance_governor

    - name: 📊 Optimize OS - Configure MongoDB kernel and network limits
      blockinfile:
        path: /etc/sysctl.d/99-mongodb-rk1.conf
        create: yes
        block: |
          # MongoDB memory mapping and file descriptor requirements
          vm.max_map_count = 262144
          fs.file-max = 2097152
          vm.swappiness = 1

          # Bound dirty page accumulation to reduce write-latency spikes
          vm.dirty_background_bytes = 67108864
          vm.dirty_bytes = 268435456
          vm.dirty_expire_centisecs = 3000
          vm.dirty_writeback_centisecs = 500

          # Allow more simultaneous MongoDB client connections and handshakes
          net.core.somaxconn = 4096
          net.ipv4.tcp_max_syn_backlog = 4096
          net.ipv4.ip_local_port_range = 10240 65535
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 65536 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          net.core.netdev_max_backlog = 5000
      notify: reload_sysctl

    - name: 📊 Optimize OS - Ensure time synchronization is active
      apt:
        name: chrony
        state: present
        update_cache: yes

    - name: 📊 Optimize OS - Enable time synchronization
      systemd:
        name: chrony
        state: started
        enabled: yes
        
    - name: 📊 Optimize OS - Increase file descriptor limits
      blockinfile:
        path: /etc/security/limits.d/99-mongodb-rk1.conf
        create: yes
        block: |
          * soft nofile 65536
          * hard nofile 65536
          * soft nproc 32768
          * hard nproc 32768
          
    - name: 💾 Configure the NVMe scheduler for low-latency database I/O
      copy:
        dest: /etc/udev/rules.d/60-rk1-nvme-scheduler.rules
        mode: '0644'
        content: |
          ACTION=="add|change", KERNEL=="nvme[0-9]*n[0-9]*", ATTR{queue/scheduler}="none"
      notify:
        - reload_udev
        - apply_nvme_scheduler

    - name: 💾 Enable periodic NVMe discard/TRIM
      systemd:
        name: fstrim.timer
        state: started
        enabled: yes

    - name: 🐳 Create Docker service drop-in directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: 🐳 Configure Docker service resource limits
      copy:
        dest: /etc/systemd/system/docker.service.d/10-mongodb-limits.conf
        mode: '0644'
        content: |
          [Service]
          LimitNOFILE=1048576
          LimitNPROC=65536
      notify: restart_docker
      
    # NVMe Storage Optimization
    - name: 💾 Create MongoDB data directory
      file:
        path: "{{ mongodb_storage_mount }}/mongodb"
        state: directory
        owner: "999"
        group: "999"
        mode: '0755'
        
    - name: 💾 Check if NVMe is already mounted
      command: "mountpoint -q {{ mongodb_storage_mount }}"
      register: mount_check
      failed_when: false
      changed_when: false
      
    - name: 💾 Format NVMe drive with XFS
      community.general.filesystem:
        fstype: xfs
        dev: "{{ mongodb_storage_device }}"
        #opts: -f
      when: mount_check.rc != 0
      
    - name: 💾 Mount NVMe drive with optimal options
      mount:
        path: "{{ mongodb_storage_mount }}"
        src: "{{ mongodb_storage_device }}"
        fstype: xfs
        # 'nobarrier' was removed from XFS in modern kernels and fails to mount on
        # Ubuntu 22.04's 5.15+ kernel - write barriers are safe to leave enabled.
        opts: noatime,nodiratime,logbufs=8
        state: mounted
      
    - name: 💾 Ensure MongoDB data directory exists after mount
      file:
        path: "{{ mongodb_storage_mount }}/mongodb"
        state: directory
        owner: "999"
        group: "999"
        mode: '0755'
        
    # Docker Installation
    - name: 🐳 Install Docker dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
        
    - name: 🐳 Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        
    - name: 🐳 Add Docker repository
      apt_repository:
        repo: "deb [arch=arm64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        
    - name: 🐳 Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - logrotate
        state: present
        update_cache: yes

    - name: Configure container logging and reclaim root filesystem space
      include_tasks: configure_container_logging_tasks.yml
        
    - name: 🐳 Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes
        
    - name: 🐳 Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
        
    # MongoDB Container Setup
    - name: 🍃 Create MongoDB keyfile for replica set authentication
      copy:
        content: "{{ vault_mongodb_keyfile }}"
        dest: "{{ mongodb_storage_mount }}/mongodb/keyfile"
        owner: "999"
        group: "999" 
        mode: '0400'
      no_log: true
        
    - name: 🍃 Run MongoDB container - Data nodes
      community.docker.docker_container:
        name: mongodb
        image: "mongo:{{ mongodb_version }}"
        state: started
        restart_policy: always
        ports:
          - "{{ mongodb_port }}:27017"
        etc_hosts:
          rk1-node1: "{{ hostvars['rk1-node1'].ansible_host }}"
          rk1-node2: "{{ hostvars['rk1-node2'].ansible_host }}"
          rk1-node3: "{{ hostvars['rk1-node3'].ansible_host }}"
          rk1-node4: "{{ hostvars['rk1-node4'].ansible_host }}"
        volumes:
          - "{{ mongodb_storage_mount }}/mongodb:/data/db"
          - "{{ mongodb_storage_mount }}/mongodb/keyfile:/data/keyfile"
        ulimits:
          - nofile:1048576:1048576
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"
        env:
          MONGO_INITDB_ROOT_USERNAME: "{{ vault_mongodb_admin_user }}"
          MONGO_INITDB_ROOT_PASSWORD: "{{ vault_mongodb_admin_password }}"
          GLIBC_TUNABLES: "{{ mongodb_glibc_tunables }}"
        command: >
          mongod 
          --replSet {{ replica_set_name }}
          --bind_ip_all
          --keyFile /data/keyfile
          --auth
          --wiredTigerCacheSizeGB {{ mongodb_wiredtiger_cache_size_gb }}
          --wiredTigerCollectionBlockCompressor {{ mongodb_wiredtiger_collection_compressor }}
        healthcheck:
          test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          interval: 30s
          timeout: 10s
          retries: 3
      no_log: true
      
    - name: 🍃 Wait for MongoDB to be ready
      wait_for:
        port: "{{ mongodb_port }}"
        delay: 10
        timeout: 60
        
  handlers:
    - name: reload_systemd
      systemd:
        daemon_reload: yes

    - name: enable_thp_service
      systemd:
        name: enable-transparent-huge-pages.service
        daemon_reload: yes
        enabled: yes
        state: restarted

    - name: enable_performance_governor
      systemd:
        name: rk1-performance-governor.service
        daemon_reload: yes
        enabled: yes
        state: started

    - name: reload_sysctl
      command: sysctl --system

    - name: reload_udev
      command: udevadm control --reload-rules

    - name: apply_nvme_scheduler
      command: udevadm trigger --subsystem-match=block --sysname-match=nvme*

    - name: restart_docker
      systemd:
        name: docker
        daemon_reload: yes
        state: restarted

    - name: restart_systemd_journald
      systemd:
        name: systemd-journald
        daemon_reload: yes
        state: restarted

# Initialize Replica Set
- name: Initialize MongoDB Replica Set
  hosts: rk1-node1
  vars:
    replica_set_name: "turingpi_rs"
    
  tasks:
    - name: 🎯 Initialize replica set on primary node
      shell: |
        docker exec mongodb mongosh --quiet \
          -u '{{ vault_mongodb_admin_user }}' -p '{{ vault_mongodb_admin_password }}' --authenticationDatabase admin \
          --eval "
        rs.initiate({
          _id: '{{ replica_set_name }}',
          members: [
            { _id: 0, host: 'rk1-node1:27017', priority: 2 },
            { _id: 1, host: 'rk1-node2:27017', priority: 1 },
            { _id: 2, host: 'rk1-node3:27017', priority: 1 }
          ]
        })"
      register: rs_init
      retries: 10
      delay: 10
      until: rs_init.rc == 0 or 'already initialized' in (rs_init.stdout | lower) or 'already initialized' in (rs_init.stderr | lower)
      failed_when: rs_init.rc != 0 and 'already initialized' not in (rs_init.stdout | lower) and 'already initialized' not in (rs_init.stderr | lower)
      no_log: true
      
    - name: 🎯 Create admin user
      shell: |
        sleep 15
        docker exec mongodb mongosh --quiet --eval "
        db.getSiblingDB('admin').createUser({
          user: '{{ vault_mongodb_admin_user }}',
          pwd: '{{ vault_mongodb_admin_password }}',
          roles: ['root']
        })"
      register: user_creation
      failed_when: false
      no_log: true
      
    - name: ✅ Display replica set status
      debug:
        msg: "Replica set initialization: {{ rs_init.stdout if rs_init.stdout else rs_init.stderr }}"

