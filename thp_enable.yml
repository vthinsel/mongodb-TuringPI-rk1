---
- name: Enable MongoDB 8 Transparent Huge Pages
  hosts: mongodb_cluster
  become: yes
  serial: 1

  tasks:
    - name: Remove the THP disable service
      file:
        path: /etc/systemd/system/disable-thp.service
        state: absent

    - name: Locate the kernel THP interface
      shell: |
        if [ -d /sys/kernel/mm/transparent_hugepage ]; then
          echo /sys/kernel/mm/transparent_hugepage
        elif [ -d /sys/kernel/mm/redhat_transparent_hugepage ]; then
          echo /sys/kernel/mm/redhat_transparent_hugepage
        fi
      register: thp_root
      changed_when: false

    - name: Require kernel THP support
      fail:
        msg: >-
          The kernel on {{ inventory_hostname }} does not expose a THP sysfs
          interface. MongoDB 8 requires THP on supported ARM64 systems. Install
          or boot an RK1 kernel with CONFIG_TRANSPARENT_HUGEPAGE enabled, then
          rerun this playbook.
      when: thp_root.stdout | trim == ''

    - name: Install the MongoDB 8 THP service
      copy:
        dest: /etc/systemd/system/enable-transparent-huge-pages.service
        mode: '0644'
        content: |
          [Unit]
          Description=Enable Transparent Huge Pages (THP) for MongoDB 8
          DefaultDependencies=no
          After=sysinit.target local-fs.target
          Before=basic.target docker.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo always | tee /sys/kernel/mm/transparent_hugepage/enabled > /dev/null && echo defer+madvise | tee /sys/kernel/mm/transparent_hugepage/defrag > /dev/null && echo 0 | tee /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none > /dev/null && echo 1 | tee /proc/sys/vm/overcommit_memory > /dev/null'
          RemainAfterExit=yes

          [Install]
          WantedBy=basic.target

    - name: Apply and start the THP enable service
      systemd:
        name: enable-transparent-huge-pages.service
        daemon_reload: yes
        enabled: yes
        state: restarted

    - name: Restart MongoDB after changing THP
      community.docker.docker_container:
        name: mongodb
        state: started
        restart: yes

    - name: Wait for MongoDB after restart
      wait_for:
        port: 27017
        delay: 5
        timeout: 60

    - name: Display the active THP settings
      shell: |
        if [ -d /sys/kernel/mm/transparent_hugepage ]; then
          thp_root=/sys/kernel/mm/transparent_hugepage
        elif [ -d /sys/kernel/mm/redhat_transparent_hugepage ]; then
          thp_root=/sys/kernel/mm/redhat_transparent_hugepage
        else
          echo 'THP sysfs interface is missing'; exit 1
        fi
        printf 'enabled='; cat "$thp_root/enabled"
        printf 'defrag='; cat "$thp_root/defrag"
        if [ -r "$thp_root/khugepaged/max_ptes_none" ]; then
          printf 'max_ptes_none='; cat "$thp_root/khugepaged/max_ptes_none"
        else
          echo 'max_ptes_none=unsupported-by-kernel'
        fi
        printf 'overcommit_memory='; cat /proc/sys/vm/overcommit_memory
        docker exec mongodb mongosh --quiet \
          -u '{{ vault_mongodb_admin_user }}' -p '{{ vault_mongodb_admin_password }}' \
          --authenticationDatabase admin \
          --eval "const extra = db.hostInfo().extra; print('db.hostInfo().extra.thp_enabled=' + extra.thp_enabled); print('db.hostInfo().extra.thp_defrag=' + extra.thp_defrag); print('db.hostInfo().extra.thp_max_ptes_none=' + extra.thp_max_ptes_none); print('db.hostInfo().extra.overcommit_memory=' + extra.overcommit_memory)"
      register: thp_settings
      changed_when: false

    - name: Report the active THP settings
      debug:
        var: thp_settings.stdout_lines