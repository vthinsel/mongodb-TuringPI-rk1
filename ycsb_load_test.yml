---
# First YCSB load test against the unauthenticated MongoDB primary.
# Usage:
#   ansible-playbook --ask-vault-pass -i inventory.yml ycsb_load_test.yml \
#     -e confirm_unauthenticated_ycsb=true

- name: Run first unauthenticated YCSB load test
  hosts: control
  become: yes
  gather_facts: no
  vars:
    ycsb_image: redis/go-ycsb@sha256:1a61a25f285b8f31686634d4e37668071b4cfe9912cd8f2cfb416d76b4fd567f
    ycsb_workload_file: /tmp/workload-rk1-read-write-search
    ycsb_database: ycsb
    ycsb_primary_host: rk1-node1
    ycsb_primary_port: 27017
    ycsb_record_count: 100000
    ycsb_operation_count: 100000
    ycsb_threads: 4
    ycsb_max_execution_time: 600
    ycsb_workload:
      operationcount: 100000
      fieldcount: 10
      fieldlength: 100
      readallfields: true
      writeallfields: true
      readproportion: 0.50
      updateproportion: 0.30
      scanproportion: 0.20
      insertproportion: 0.00
      readmodifywriteproportion: 0.00
      requestdistribution: zipfian
      scanlengthdistribution: uniform

  pre_tasks:
    - name: Require explicit acknowledgement of unauthenticated testing
      ansible.builtin.assert:
        that:
          - confirm_unauthenticated_ycsb | default(false) | bool
        fail_msg: >-
          This test sends unauthenticated traffic to MongoDB. Re-run with
          -e confirm_unauthenticated_ycsb=true only on an isolated test cluster.

    - name: Verify primary is reachable
      ansible.builtin.wait_for:
        host: "{{ ycsb_primary_host }}"
        port: "{{ ycsb_primary_port }}"
        timeout: 30

  tasks:
    - name: Pull the YCSB container image
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ ycsb_image }}"
      changed_when: true

    - name: Create mixed read/write/search workload definition
      ansible.builtin.copy:
        dest: "{{ ycsb_workload_file }}"
        mode: '0644'
        content: |
          workload=site.ycsb.workloads.CoreWorkload
          recordcount={{ ycsb_record_count }}
          operationcount={{ ycsb_workload.operationcount }}
          fieldcount={{ ycsb_workload.fieldcount }}
          fieldlength={{ ycsb_workload.fieldlength }}
          readallfields={{ ycsb_workload.readallfields }}
          writeallfields={{ ycsb_workload.writeallfields }}
          readproportion={{ ycsb_workload.readproportion }}
          updateproportion={{ ycsb_workload.updateproportion }}
          scanproportion={{ ycsb_workload.scanproportion }}
          insertproportion={{ ycsb_workload.insertproportion }}
          readmodifywriteproportion={{ ycsb_workload.readmodifywriteproportion }}
          requestdistribution={{ ycsb_workload.requestdistribution }}
          scanlengthdistribution={{ ycsb_workload.scanlengthdistribution }}

    - name: Load initial YCSB dataset into the primary
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --entrypoint
          - /go-ycsb
          - --network
          - host
          - --add-host
          - "rk1-node1:{{ hostvars['rk1-node1'].ansible_host }}"
          - --add-host
          - "rk1-node2:{{ hostvars['rk1-node2'].ansible_host }}"
          - --add-host
          - "rk1-node3:{{ hostvars['rk1-node3'].ansible_host }}"
          - --add-host
          - "rk1-node4:{{ hostvars['rk1-node4'].ansible_host }}"
          - --volume
          - "{{ ycsb_workload_file }}:/workload:ro"
          - "{{ ycsb_image }}"
          - load
          - mongodb
          - -P
          - /workload
          - -p
          - "mongodb.url=mongodb://{{ ycsb_primary_host }}:{{ ycsb_primary_port }}/{{ ycsb_database }}?directConnection=true"
          - -p
          - "recordcount={{ ycsb_record_count }}"
          - -p
          - "insertcount={{ ycsb_record_count }}"
          - -p
          - "dropdata=true"
          - -p
          - "mongodb.write_concern=1"
      register: ycsb_load
      changed_when: true
      failed_when: >-
        ycsb_load.rc != 0 or
        'Run finished' not in (ycsb_load.stdout | default('')) or
        ('Count: ' ~ (ycsb_record_count | string)) not in (ycsb_load.stdout | default(''))

    - name: Run mixed YCSB read/write/search workload on the primary
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --entrypoint
          - /go-ycsb
          - --network
          - host
          - --add-host
          - "rk1-node1:{{ hostvars['rk1-node1'].ansible_host }}"
          - --add-host
          - "rk1-node2:{{ hostvars['rk1-node2'].ansible_host }}"
          - --add-host
          - "rk1-node3:{{ hostvars['rk1-node3'].ansible_host }}"
          - --add-host
          - "rk1-node4:{{ hostvars['rk1-node4'].ansible_host }}"
          - --volume
          - "{{ ycsb_workload_file }}:/workload:ro"
          - "{{ ycsb_image }}"
          - run
          - mongodb
          - -P
          - /workload
          - -p
          - "mongodb.url=mongodb://{{ ycsb_primary_host }}:{{ ycsb_primary_port }}/{{ ycsb_database }}?directConnection=true"
          - -p
          - "operationcount={{ ycsb_operation_count }}"
          - -p
          - "threadcount={{ ycsb_threads }}"
          - -p
          - "maxexecutiontime={{ ycsb_max_execution_time }}"
          - -p
          - "mongodb.read_preference=primary"
          - -p
          - "mongodb.write_concern=1"
      register: ycsb_run
      changed_when: true

    - name: Display YCSB load result
      ansible.builtin.debug:
        var: ycsb_load.stdout_lines

    - name: Display YCSB run result
      ansible.builtin.debug:
        var: ycsb_run.stdout_lines
