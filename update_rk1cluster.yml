---
# Update every RK1 compute node, including rk1-node4, one node at a time.
# Usage: ansible-playbook -i inventory.yml update_rk1cluster.yml [-e reboot=true]
- name: Update RK1 cluster nodes
  hosts: mongodb_cluster:control
  serial: 1
  become: yes
  gather_facts: yes

  vars:
    reboot: false

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes

    - name: Pull all tagged Docker images
      ansible.builtin.shell: |
        set -o pipefail
        docker image ls --format '{% raw %}{{.Repository}} {{.Tag}}{% endraw %}' \
          | awk '$1 != "<none>" && $2 != "<none>" && NF == 2 { print $1 ":" $2 }' \
          | sort -u \
          | while IFS= read -r image; do
              docker pull "$image" || exit $?
            done
      register: docker_image_updates
      changed_when: false
      args:
        executable: /bin/bash

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Clean apt package cache
      ansible.builtin.command: apt-get clean
      changed_when: false

    - name: Reboot when requested and required
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - reboot | bool
        - reboot_required.stat.exists