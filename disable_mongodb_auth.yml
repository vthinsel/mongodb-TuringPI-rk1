---
- name: Disable MongoDB Authentication (non-production only)
  hosts: mongodb_cluster
  become: yes
  serial: 1
  vars_files:
    - mongodb_image_vars.yml
  vars:
    mongodb_uid: "1000"
    mongodb_gid: "1000"
    mongodb_storage_mount: "/data"
    replica_set_name: "turingpi_rs"
    mongodb_port: 27017

  pre_tasks:
    - name: Require explicit confirmation before disabling authentication
      ansible.builtin.assert:
        that:
          - disable_mongodb_auth | default(false) | bool
        fail_msg: >-
          This playbook disables MongoDB authentication and is intended only for
          convenience or testing. Re-run with -e disable_mongodb_auth=true if this
          is really intended.

  tasks:
    - name: Ensure MongoDB data files are owned by the image user
      ansible.builtin.file:
        path: "{{ mongodb_storage_mount }}/mongodb"
        state: directory
        owner: "{{ mongodb_uid }}"
        group: "{{ mongodb_gid }}"
        recurse: yes

    - name: Recreate MongoDB without client or replica-set authentication
      community.docker.docker_container:
        name: mongodb
        image: "{{ mongodb_image }}:{{ mongodb_version }}"
        state: started
        restart_policy: always
        recreate: true
        ports:
          - "{{ mongodb_port }}:27017"
        etc_hosts:
          rk1-node1: "{{ hostvars['rk1-node1'].ansible_host }}"
          rk1-node2: "{{ hostvars['rk1-node2'].ansible_host }}"
          rk1-node3: "{{ hostvars['rk1-node3'].ansible_host }}"
          rk1-node4: "{{ hostvars['rk1-node4'].ansible_host }}"
        volumes:
          - "{{ mongodb_storage_mount }}/mongodb:/data/db"
        command: >-
          mongod --replSet {{ replica_set_name }}
        healthcheck:
          test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          interval: 30s
          timeout: 10s
          retries: 3

    - name: Wait for unauthenticated MongoDB to be ready
      ansible.builtin.wait_for:
        port: "{{ mongodb_port }}"
        delay: 5
        timeout: 60